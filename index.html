<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d"><link rel="manifest" href="manifest.json"><title>Property Inspection</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:#17324d;color:#fff;padding:24px 18px}header h1{margin:0;font-size:25px}header p{margin:6px 0 0;color:#dce7f0;font-size:14px}main{max-width:920px;margin:auto;padding:18px}.intro,.card{background:#fff;border:1px solid #d9e0e7;border-radius:15px;padding:18px;margin-bottom:15px;box-shadow:0 2px 8px #0000000a}.intro h2{margin:0 0 6px}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.choice{display:block;width:100%;min-height:135px;text-align:left;background:#fff;border:1px solid #d9e0e7;border-radius:16px;padding:20px;cursor:pointer;box-shadow:0 3px 10px #0000000a}.choice:hover{border-color:#2563eb}.choice .icon{font-size:32px}.choice h2{margin:12px 0 5px;font-size:18px}.choice p{margin:0;color:#667085;font-size:13px}.hidden{display:none!important}.back{background:none;border:0;color:#fff;padding:0 0 8px;font-size:14px;cursor:pointer}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d9e0e7;border-radius:9px;font:inherit;background:#fff}.field textarea{min-height:80px}.section-item{border:1px solid #d9e0e7;border-radius:11px;padding:12px;margin:9px 0}.section-item strong{display:block;margin-bottom:8px;font-size:14px}.status{display:flex;flex-wrap:wrap;gap:7px}.status label{border:1px solid #d9e0e7;border-radius:8px;padding:7px 9px;font-size:12px}.photos{margin-top:9px;border:1px dashed #aeb9c5;border-radius:9px;padding:10px;background:#fafbfc}.photos input{width:100%}.thumbs{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.thumbs img{width:86px;height:70px;object-fit:cover;border-radius:7px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#fff;border:1px solid #d9e0e7}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:12px}}
</style></head>
<body>
<header id="homeHeader"><h1>Property Inspection</h1><p>Select the inspection you are performing.</p></header>
<header id="inspectionHeader" class="hidden"><button class="back" onclick="goHome()">← Back to Inspection Selection</button><h1 id="inspectionTitle"></h1><p id="inspectionSub"></p></header>
<main>
<section id="home">
<div class="intro"><h2>Choose Inspection</h2><div class="muted">Select one option below to begin.</div></div>
<div class="grid">
<button class="choice" onclick="openInspection('tenant')"><div class="icon">🏢</div><h2>Tenant Inspection</h2><p>Occupied tenant space inspection</p></button>
<button class="choice" onclick="openInspection('moveout')"><div class="icon">🚪</div><h2>Move-Out Inspection</h2><p>Document tenant move-out condition</p></button>
<button class="choice" onclick="openInspection('vacant')"><div class="icon">🏠</div><h2>Vacant Unit Inspection</h2><p>Inspect vacant units and turn needs</p></button>
<button class="choice" onclick="openInspection('exterior')"><div class="icon">🏬</div><h2>Exterior Property Inspection</h2><p>Building, grounds, parking and site</p></button>
<button class="choice" onclick="openInspection('roof')"><div class="icon">🏗️</div><h2>Roof Inspection</h2><p>Roof surface, drainage and penetrations</p></button>
<button class="choice" onclick="openInspection('hvac')"><div class="icon">❄️</div><h2>HVAC Inspection</h2><p>Equipment and operating condition</p></button>
</div></section>
<section id="app" class="hidden">
<div class="card"><h2>Property Information</h2><div class="grid">
<div class="field"><label>Property Name</label><select id="property"><option value="">Select property...</option></select></div><div class="field"><label>Property Address</label><input id="address" readonly></div>
<div class="field"><label>Inspection Date</label><input id="date" type="date"></div><div class="field"><label>Conducted By</label><select id="tech"><option value="">Select technician...</option></select></div>
<div class="field"><label>Property Contact</label><input id="contact"></div><div class="field"><label>Units / Suites Inspected</label><input id="units"></div>
</div></div><div id="body"></div>
<div class="card"><h2>Overall Assessment</h2><div class="grid"><div class="field"><label>Overall Condition</label><select><option>Good</option><option>Fair</option><option>Needs Attention</option><option>Urgent Repair Needed</option></select></div><div class="field"><label>Priority</label><select><option>Routine</option><option>Monitor</option><option>High</option><option>Emergency</option></select></div></div><div class="field" style="margin-top:12px"><label>Technician Notes</label><textarea></textarea></div></div>
<div class="actions"><button class="btn primary" onclick="alert('Inspection saved on this device.')">Save Inspection</button><button class="btn secondary" onclick="window.print()">Print / Save PDF</button><button class="btn secondary" onclick="goHome()">Back to Inspection Selection</button></div>
</section></main>
<script>
const properties=[['46th Street Medical LLC','14020 N 46th Street, Tampa, FL 33613-2813'],['Altamonte / SSG Inc.','1032-1098 Montgomery Road, Altamonte Springs, FL 32714'],['Big Bend Medical Park LLC - Association','13123-13145 Kings Lake Drive, Gibsonton, FL 33534'],['Big Bend Medical Park, LLC - Operating','13145 Kings Lake Drive, 6-101, 6-102, Gibsonton, FL 33534'],['Brandon Mall General Partnership','903-1101 W. Brandon Blvd., Brandon, FL 33511'],['Bruce B. Downs Professional Center Condominium Association','12206 Bruce B. Downs Blvd, Tampa, FL 33612'],['Bruce B. Downs Professional Center LLC','12210 Bruce B. Downs Blvd, Tampa, FL 33612'],['Clearwater Storage LLC','1861 N Highland Ave., Clearwater, FL 33755'],['Fishhawk Office Park LLC - Operating','16627-16641 Fishhawk Blvd., Lithia, FL 33547'],['Fishhawk Professional Center Owner\'s Association, Inc.','5454-5486 Lithia Pinecrest Road, Lithia, FL 33547'],['Fishhawk Storage LLC','16617 Fishhawk Blvd., Lithia, FL 33547'],['Florida Bearss Associates LLC','202-238 E. Bearss Ave. (110 E Bearss o/p), Tampa, FL 33613'],['Golding United Fishhawk LLC','16707 - 16769 Fishhawk Blvd., Lithia, FL 33547'],['Howard & A LLC','202, 204, 206 N. Howard Ave.; 2303 West N. A. St., Tampa, FL 33606'],['Howard & Main, LLC','1702, 1704 N. Howard Ave., Tampa, FL 33607'],['Interbay Commons LLC','6301 - 6302 Interbay Commons Way, Tampa, FL 33611'],['Lake St. Charles Medical Center LLC','10522-10548 Lake St. Charles Blvd., Riverview, FL 33578'],['Oakley Center LLC','27814 Grove Isle Drive, Wesley Chapel, FL 33544'],['Park Boulevard Shopping Center LTD','7400-7700 49th Street N, Pinellas Park, FL 33781'],['RSVP Fishhawk LLC - Operating','5454-5486 Lithia Pinecrest Road, Lithia, FL 33547'],['RSVP Hyde Park LLC','2111 W Swann Ave., Tampa, FL 33606'],['Scher Investments, LLC','204 N Howard Ave, Tampa, FL 33606'],['Shoppes at 54 LLC','7643-7657 SR 54 (54 & Cita Lane), New Port Richey, FL 34653-6217'],['Shoppes at Osprey Fishhawk LLC','15258-15282 Fishhawk Blvd, Lithia, FL 33547'],['Skipper 42 LLC','14530 N 42nd Street, Tampa, FL 33613-2813'],['Sunset Square General Partnership','1861-1895 N. Highland Ave.; 1521-1527 Sunset Point Road, Clearwater, FL 33755'],['Superior Lodge LLC','204 N Howard Ave., Tampa, FL 33606'],['Main Street 2106, LLC','2106 W Main Street, Tampa, FL 33607'],["Town 'n Country Plaza LLC",'7505-7605 W. Hillsborough Ave., Tampa, FL 33615'],['Twelve Oaks Plaza LLP','7004-7340 W. Waters Ave., Tampa, FL 33634'],['Willow-Scher Investments LLC','309, 311 South Willow Ave., Unit 1,2,3, Tampa, FL 33606']];
const techs=['Chris Howard','Philip Cyphers','Craig Cerny','Sarah Anello','Jarrod Bray','Lane Greenbank'];
const sets={tenant:['Plumbing',['Leaks / water damage','Faucets / fixtures','Toilets','Sinks / drains','Cleanouts','Water heater','Backflow preventer','Other plumbing issue'],'Grease Trap',['Trap condition','Leak','Odor','Drainage','Lid / access','General condition']],moveout:['Interior Condition',['Walls & paint','Flooring','Ceilings','Interior doors','Windows / glass','Window coverings','Light fixtures','Wall-mounted fixtures','Trash or debris'],'Restrooms',['Fixtures removed / damaged','Walls / floors','Trash / cleaning','Water status'],'Break Room / Kitchen',['Sink / countertops','Appliances removed','Grease / food debris'],'Storage / Back of House',['Shelving / fixtures','Trash / items left behind','Rear door & surrounding area'],'Electrical',['Panel condition','Panel schedule','Breakers','Disconnect'],'Tenant Modifications',['Signage','Security systems','Partition walls','Electrical / lighting modifications','Other']],vacant:['Vacant Unit Condition',['Walls / paint','Flooring','Ceilings','Doors','Windows / glass','Lighting','Trash / debris'],'Plumbing',['Leaks','Faucets / fixtures','Toilets','Drains / cleanouts','Water heater','Backflow','Other plumbing issue'],'Vacant Unit Turn',['Cleaning needed','Painting needed','Flooring needed','Repairs needed','Fixtures needed','Keys / access','Ready for next tenant']],exterior:['Building & Exterior',['Building','Fascia','Store fronts','Canopy & ceiling','Canopy access','Walls','Windows','Doors','Cracks & joints','Gutters & downspouts','Handrails'],'Parking Lot',['Parking lot surface','Seal / potholes','Striping','Arrows & car stops','Fire lanes','Handicap spaces','Grates','Bollards','Sweeping / trash'],'Trash / Dumpster Area',['Dumpsters','Percentage full','Size','Odor','Trash bags','Repair needed','Dump day'],'Landscaping',['Mowing / edging','Trimming','Dead plants','Weed control','Tree trimming','Pest control grass','Palms','Pest control shrubs','Fertilizing','Mulch'],'Lighting / Security / Signage',['Lighting - parking lot','Canopy & fascia lighting','Security','Interior / exterior sign lighting','Lit signs','Pylon','Tenant signs','Illegal / unapproved signs','Stop','Handicap','Fire lane','No bike or skateboard','Leasing']],roof:['Roof',['Roof surface','Membrane / shingles','Flashing','Penetrations','Roof drains / scuppers','Gutters / downspouts','Ponding water','Leaks / water intrusion','Roof equipment','Damage / deterioration','Other roof issue']],hvac:['HVAC Equipment',['System operation','Thermostat','Filters','Condenser','Evaporator / air handler','Condensate drain','Drain pan','Refrigerant lines','Electrical disconnect','Belts / motors','Noise / vibration','Leaks / water damage','Other HVAC issue']]};
const names={tenant:['Tenant Inspection','Occupied tenant space inspection'],moveout:['Move-Out Inspection','Document tenant move-out condition'],vacant:['Vacant Unit Inspection','Inspect vacant units and turn needs'],exterior:['Exterior Property Inspection','Building, grounds, parking and site'],roof:['Roof Inspection','Roof surface, drainage and penetrations'],hvac:['HVAC Inspection','Equipment and operating condition']};
let current='';
function openInspection(k){current=k;home.classList.add('hidden');app.classList.remove('hidden');homeHeader.classList.add('hidden');inspectionHeader.classList.remove('hidden');inspectionTitle.textContent=names[k][0];inspectionSub.textContent=names[k][1];let a=sets[k],html='';for(let i=0;i<a.length;i+=2){html+='<div class="card"><h2>'+a[i]+'</h2>';a[i+1].forEach((x,j)=>{let id=k+'-'+i+'-'+j;html+='<div class="section-item"><strong>'+x+'</strong><div class="status"><label><input type="radio" name="'+id+'">Good</label><label><input type="radio" name="'+id+'">Fair</label><label><input type="radio" name="'+id+'">Needs Attention</label><label><input type="radio" name="'+id+'">N/A</label></div><div class="photos"><label><strong>Upload Photos</strong> — select multiple</label><input type="file" accept="image/*" multiple onchange="preview(this,\''+id+'\')"><div class="thumbs" id="p-'+id+'"></div></div><div class="field" style="margin-top:8px"><label>Item Notes</label><textarea placeholder="Notes..."></textarea></div></div>)}html+='</div>'}body.innerHTML=html;scrollTo(0,0)}
function preview(input,id){let out=document.getElementById('p-'+id);out.innerHTML='';Array.from(input.files).forEach(f=>{let im=document.createElement('img');im.src=URL.createObjectURL(f);out.appendChild(im)})}
function goHome(){app.classList.add('hidden');home.classList.remove('hidden');inspectionHeader.classList.add('hidden');homeHeader.classList.remove('hidden');scrollTo(0,0)}
properties.forEach((p,i)=>property.insertAdjacentHTML('beforeend','<option value="'+i+'">'+p[0]+'</option>'));techs.forEach(t=>tech.insertAdjacentHTML('beforeend','<option>'+t+'</option>'));date.value=new Date().toISOString().slice(0,10);property.onchange=()=>address.value=property.value===''?'':properties[property.value][1];
</script></body></html>
