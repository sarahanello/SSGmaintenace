<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<link rel="manifest" href="manifest.json">
<title>Property Inspection</title>
<style>
:root{--navy:#17324d;--blue:#2563eb;--bg:#f4f6f8;--card:#fff;--line:#d9e0e7;--text:#17202a;--muted:#667085;--good:#198754;--warn:#c77b00;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:var(--navy);color:#fff;padding:22px 18px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;color:#d8e3ee;font-size:13px}
main{max-width:900px;margin:0 auto;padding:18px}.home-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}
.inspection-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 18px;text-align:left;box-shadow:0 2px 8px #00000008;cursor:pointer;min-height:125px}
.inspection-card:active{transform:scale(.99)}.icon{font-size:30px}.inspection-card h2{font-size:17px;margin:12px 0 4px}.inspection-card p{font-size:13px;color:var(--muted);margin:0}
.hidden{display:none!important}.back{background:none;border:0;color:#fff;font-size:14px;padding:0 0 8px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}.card h2{margin:0 0 14px;font-size:18px}.section-title{font-size:15px;font-weight:700;color:var(--navy);margin:20px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;background:#fff}.field textarea{min-height:85px;resize:vertical}
.item{border:1px solid var(--line);border-radius:11px;padding:12px;margin:8px 0;background:#fafbfc}.item strong{display:block;font-size:14px;margin-bottom:8px}.status{display:flex;gap:8px;flex-wrap:wrap}.status label{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;background:#fff}.status input{margin-right:5px}
.photo-box{border:1px dashed #aeb9c5;border-radius:10px;padding:12px;background:#fafbfc;margin-top:8px}.photo-box input{width:100%}.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.photos img{width:92px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.actions{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);padding:12px 0}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.danger{background:#fff0ef;color:var(--bad);border:1px solid #f2c5c1}
@media(max-width:620px){.home-grid,.grid{grid-template-columns:1fr}.inspection-card{min-height:110px}main{padding:12px}}
</style>
</head>
<body>
<header>
  <div id="homeHeader"><h1>Property Inspection</h1><p>Select the inspection you are performing.</p></div>
  <div id="inspectionHeader" class="hidden">
    <button class="back" onclick="showHome()">← Back to Inspection Selection</button>
    <h1 id="inspectionTitle"></h1><p id="inspectionSubtitle"></p>
  </div>
</header>

<main>
<section id="home">
  <div class="card"><h2>Choose Inspection</h2><p style="color:var(--muted);margin:0">Select one option below to begin.</p></div>
  <div class="home-grid" id="inspectionCards"></div>
</section>

<section id="inspection" class="hidden">
  <div class="card">
    <h2>Property Information</h2>
    <div class="grid">
      <div class="field"><label>Property Name</label><select id="property"></select></div>
      <div class="field"><label>Property Address</label><input id="address" readonly></div>
      <div class="field"><label>Inspection Date</label><input id="date" type="date"></div>
      <div class="field"><label>Conducted By</label><select id="tech"></select></div>
      <div class="field"><label>Property Contact</label><input id="contact"></div>
      <div class="field"><label>Units / Suites Inspected</label><input id="units"></div>
    </div>
  </div>
  <div id="inspectionBody"></div>
  <div class="card">
    <h2>Overall Assessment</h2>
    <div class="grid">
      <div class="field"><label>Overall Condition</label><select id="overall"><option>Good</option><option>Fair</option><option>Needs Attention</option><option>Urgent Repair Needed</option></select></div>
      <div class="field"><label>Priority</label><select id="priority"><option>Routine</option><option>Monitor</option><option>High</option><option>Emergency</option></select></div>
    </div>
    <div class="field" style="margin-top:12px"><label>Technician Notes</label><textarea id="notes"></textarea></div>
  </div>
  <div class="actions">
    <button class="btn primary" onclick="saveInspection()">Save Inspection</button>
    <button class="btn secondary" onclick="window.print()">Print / Save PDF</button>
    <button class="btn danger" onclick="newInspection()">New Inspection</button>
  </div>
</section>
</main>

<script>
const properties = [
["46th Street Medical LLC","14020 N 46th Street, Tampa, FL 33613-2813"],["Altamonte / SSG Inc.","1032-1098 Montgomery Road, Altamonte Springs, FL 32714"],["Big Bend Medical Park LLC - Association","13123-13145 Kings Lake Drive, Gibsonton, FL 33534"],["Big Bend Medical Park, LLC - Operating","13145 Kings Lake Drive, 6-101, 6-102, Gibsonton, FL 33534"],["Brandon Mall General Partnership","903-1101 W. Brandon Blvd., Brandon, FL 33511"],["Bruce B. Downs Professional Center Condominium Association","12206 Bruce B. Downs Blvd, Tampa, FL 33612"],["Bruce B. Downs Professional Center LLC","12210 Bruce B. Downs Blvd, Tampa, FL 33612"],["Clearwater Storage LLC","1861 N Highland Ave., Clearwater, FL 33755"],["Fishhawk Office Park LLC - Operating","16627-16641 Fishhawk Blvd., Lithia, FL 33547"],["Fishhawk Professional Center Owner's Association, Inc.","5454-5486 Lithia Pinecrest Road, Lithia, FL 33547"],["Fishhawk Storage LLC","16617 Fishhawk Blvd., Lithia, FL 33547"],["Florida Bearss Associates LLC","202-238 E. Bearss Ave. (110 E Bearss o/p), Tampa, FL 33613"],["Golding United Fishhawk LLC","16707 - 16769 Fishhawk Blvd., Lithia, FL 33547"],["Howard & A LLC","202, 204, 206 N. Howard Ave.; 2303 West N. A. St., Tampa, FL 33606"],["Howard & Main, LLC","1702, 1704 N. Howard Ave., Tampa, FL 33607"],["Interbay Commons LLC","6301 - 6302 Interbay Commons Way, Tampa, FL 33611"],["Lake St. Charles Medical Center LLC","10522-10548 Lake St. Charles Blvd., Riverview, FL 33578"],["Oakley Center LLC","27814 Grove Isle Drive, Wesley Chapel, FL 33544"],["Park Boulevard Shopping Center LTD","7400-7700 49th Street N, Pinellas Park, FL 33781"],["RSVP Fishhawk LLC - Operating","5454-5486 Lithia Pinecrest Road, Lithia, FL 33547"],["RSVP Hyde Park LLC","2111 W Swann Ave., Tampa, FL 33606"],["Scher Investments, LLC","204 N Howard Ave, Tampa, FL 33606"],["Shoppes at 54 LLC","7643-7657 SR 54 (54 & Cita Lane), New Port Richey, FL 34653-6217"],["Shoppes at Osprey Fishhawk LLC","15258-15282 Fishhawk Blvd, Lithia, FL 33547"],["Skipper 42 LLC","14530 N 42nd Street, Tampa, FL 33613-2813"],["Sunset Square General Partnership","1861-1895 N. Highland Ave.; 1521-1527 Sunset Point Road, Clearwater, FL 33755"],["Superior Lodge LLC","204 N Howard Ave., Tampa, FL 33606"],["Main Street 2106, LLC","2106 W Main Street, Tampa, FL 33607"],["Town 'n Country Plaza LLC","7505-7605 W. Hillsborough Ave., Tampa, FL 33615"],["Twelve Oaks Plaza LLP","7004-7340 W. Waters Ave., Tampa, FL 33634"],["Willow-Scher Investments LLC","309, 311 South Willow Ave., Unit 1,2,3, Tampa, FL 33606"]
];
const techs=["Chris Howard","Philip Cyphers","Craig Cerny","Sarah Anello","Jarrod Bray","Lane Greenbank"];
const types={
tenant:{title:"Tenant Inspection",sub:"Inspect the occupied tenant space.",icon:"🏢",sections:[
["Plumbing",["Leaks / water damage","Faucets / fixtures","Toilets","Sinks / drains","Cleanouts","Water heater","Backflow preventer","Other plumbing issue"]],
["Grease Trap",["Trap condition","Leak","Odor","Drainage","Lid / access","General condition"]]],
moveout:{title:"Move-Out Inspection",sub:"Document the tenant space at move-out.",icon:"🚪",sections:[
["Interior Condition",["Walls & paint","Flooring","Ceilings","Interior doors","Windows / glass","Window coverings","Light fixtures","Wall-mounted fixtures","Trash or debris"]],
["Restrooms",["Fixtures removed / damaged","Walls / floors","Trash / cleaning","Water status"]],
["Break Room / Kitchen",["Sink / countertops","Appliances removed","Grease / food debris"]],
["Storage / Back of House",["Shelving / fixtures","Trash / items left behind","Rear door & surrounding area"]],
["Electrical",["Panel condition","Panel schedule","Breakers","Disconnect"]],
["Tenant Modifications",["Signage","Security systems","Partition walls","Electrical / lighting modifications","Other"]]],
vacant:{title:"Vacant Unit Inspection",sub:"Inspect an empty unit and document turn needs.",icon:"🏠",sections:[
["Vacant Unit Condition",["Walls / paint","Flooring","Ceilings","Doors","Windows / glass","Lighting","Trash / debris"]],
["Plumbing",["Leaks","Faucets / fixtures","Toilets","Drains / cleanouts","Water heater","Backflow","Other plumbing issue"]],
["Vacant Unit Turn",["Cleaning needed","Painting needed","Flooring needed","Repairs needed","Fixtures needed","Keys / access","Ready for next tenant"]]],
exterior:{title:"Exterior Property Inspection",sub:"Inspect building, grounds, parking and site conditions.",icon:"🏬",sections:[
["Building & Exterior",["Building","Fascia","Store fronts","Canopy & ceiling","Canopy access","Walls","Windows","Doors","Cracks & joints","Gutters & downspouts","Handrails"]],
["Parking Lot",["Parking lot surface","Seal / potholes","Striping","Arrows & car stops","Fire lanes","Handicap spaces","Grates","Bollards","Sweeping / trash"]],
["Trash / Dumpster Area",["Dumpsters","Percentage full","Size","Odor","Trash bags","Repair needed","Dump day"]],
["Landscaping",["Mowing / edging","Trimming","Dead plants","Weed control","Tree trimming","Pest control grass","Palms","Pest control shrubs","Fertilizing","Mulch"]],
["Lighting / Security / Signage",["Lighting - parking lot","Canopy & fascia lighting","Security","Interior / exterior sign lighting","Lit signs","Pylon","Tenant signs","Illegal / unapproved signs","Stop","Handicap","Fire lane","No bike or skateboard","Leasing"]]],
roof:{title:"Roof Inspection",sub:"Inspect roof surfaces, drainage and penetrations.",icon:"🏗️",sections:[
["Roof",["Roof surface","Membrane / shingles","Flashing","Penetrations","Roof drains / scuppers","Gutters / downspouts","Ponding water","Leaks / water intrusion","Roof equipment","Damage / deterioration","Other roof issue"]]],
hvac:{title:"HVAC Inspection",sub:"Inspect HVAC equipment and operating condition.",icon:"❄️",sections:[
["HVAC Equipment",["System operation","Thermostat","Filters","Condenser","Evaporator / air handler","Condensate drain","Drain pan","Refrigerant lines","Electrical disconnect","Belts / motors","Noise / vibration","Leaks / water damage","Other HVAC issue"]]]
};

let currentType=null;
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function buildHome(){
 const wrap=document.getElementById("inspectionCards");
 wrap.innerHTML=Object.entries(types).map(([key,t])=>`<button class="inspection-card" onclick="openInspection('${key}')"><div class="icon">${t.icon}</div><h2>${t.title}</h2><p>${t.sub}</p></button>`).join("");
}
function fillSelects(){
 const p=document.getElementById("property"); p.innerHTML='<option value="">Select property...</option>'+properties.map((x,i)=>`<option value="${i}">${escapeHtml(x[0])}</option>`).join("");
 document.getElementById("tech").innerHTML='<option value="">Select technician...</option>'+techs.map(x=>`<option>${x}</option>`).join("");
 p.onchange=()=>document.getElementById("address").value=p.value===""?"":properties[p.value][1];
 document.getElementById("date").value=new Date().toISOString().slice(0,10);
}
function photoHTML(key){
 return `<div class="photo-box"><label><strong>Photos</strong> — select multiple photos</label><input type="file" accept="image/*" multiple onchange="previewPhotos(this,'${key}')"><div class="photos" id="photos-${key}"></div></div>`;
}
function previewPhotos(input,id){
 const out=document.getElementById("photos-"+id); out.innerHTML="";
 [...input.files].forEach(f=>{const img=document.createElement("img");img.src=URL.createObjectURL(f);out.appendChild(img);});
}
function renderSection(title,items,si){
 let html=`<div class="card"><h2>${title}</h2>`;
 items.forEach((item,ii)=>{const id=`${currentType}-${si}-${ii}`;html+=`<div class="item"><strong>${escapeHtml(item)}</strong><div class="status">
 <label><input type="radio" name="${id}" value="Good">Good</label>
 <label><input type="radio" name="${id}" value="Fair">Fair</label>
 <label><input type="radio" name="${id}" value="Needs Attention">Needs Attention</label>
 <label><input type="radio" name="${id}" value="N/A">N/A</label>
 </div>${photoHTML(id)}<div class="field" style="margin-top:8px"><label>Item Notes</label><textarea name="note-${id}" placeholder="Notes..."></textarea></div></div>`});
 return html+"</div>";
}
function openInspection(key){
 currentType=key; const t=types[key];
 document.getElementById("home").classList.add("hidden"); document.getElementById("inspection").classList.remove("hidden");
 document.getElementById("homeHeader").classList.add("hidden"); document.getElementById("inspectionHeader").classList.remove("hidden");
 document.getElementById("inspectionTitle").textContent=t.title; document.getElementById("inspectionSubtitle").textContent=t.sub;
 document.getElementById("inspectionBody").innerHTML=t.sections.map((s,i)=>renderSection(s[0],s[1],i)).join("")+`<div class="card"><h2>Inspection Photos</h2>${photoHTML("general")}</div>`;
 window.scrollTo(0,0);
}
function showHome(){
 document.getElementById("inspection").classList.add("hidden");document.getElementById("home").classList.remove("hidden");
 document.getElementById("inspectionHeader").classList.add("hidden");document.getElementById("homeHeader").classList.remove("hidden");window.scrollTo(0,0);
}
function saveInspection(){
 const data={type:currentType,property:property.value,address:address.value,date:date.value,tech:tech.value,contact:contact.value,units:units.value,overall:overall.value,priority:priority.value,notes:notes.value,saved:new Date().toISOString()};
 localStorage.setItem("inspection-"+Date.now(),JSON.stringify(data)); alert("Inspection saved on this device.");
}
function newInspection(){ if(confirm("Start a new inspection? Unsaved information will be cleared.")){location.reload();}}
buildHome();fillSelects();
</script>
</body>
</html>
